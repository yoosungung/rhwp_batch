[package]
name = "rhwp-batch"
version = "0.1.0"
edition = "2021"
description = "CLI batch tool for HWP/HWPX conversion and template filling"
license = "MIT"

[[bin]]
name = "rhwp-batch"
path = "src/main.rs"

[lib]
name = "rhwp_batch"
path = "src/lib.rs"

[dependencies]
rhwp = { path = "../rhwp" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = "1"
base64 = "0.22"
walkdir = "2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
