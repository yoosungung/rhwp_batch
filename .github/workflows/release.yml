name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated tag to release (e.g. v0.9.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: rhwp-batch
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rhwp-batch
  # Tag push keeps github.ref_name; dispatch re-releases an existing tag without moving it.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            # macos-14 retired 2026-11-02 (actions/runner-images#13518)
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release -p rhwp-batch --target ${{ matrix.target }}

      - name: Package archive
        run: |
          TAG="${RELEASE_TAG}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="${BIN_NAME}-${TAG}-${TARGET}.tar.gz"
          STAGE="package"

          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/${BIN_NAME}" "${STAGE}/${BIN_NAME}"
          tar -czf "${ARCHIVE}" -C "${STAGE}" "${BIN_NAME}"

          HASH="$(openssl dgst -sha256 -r "${ARCHIVE}" | awk '{print $1}')"
          echo "${HASH}  ${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN_NAME }}-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum ${BIN_NAME}-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
        env:
          BIN_NAME: rhwp-batch

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/${{ env.BIN_NAME }}-*.tar.gz
            artifacts/${{ env.BIN_NAME }}-*.tar.gz.sha256
            artifacts/SHA256SUMS.txt
          generate_release_notes: true

  docker:
    name: Build and push Docker image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: artifacts

      - name: Prepare binary for image
        run: |
          TAG="${RELEASE_TAG}"
          TARGET="x86_64-unknown-linux-gnu"
          mkdir -p staging dist
          tar -xzf "artifacts/${BIN_NAME}-${TAG}-${TARGET}.tar.gz" -C staging
          install -Dm755 "staging/${BIN_NAME}" dist/rhwp-batch
        env:
          BIN_NAME: rhwp-batch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version tags
        id: ver
        run: |
          TAG="${RELEASE_TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.batch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
